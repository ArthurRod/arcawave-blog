quot;posts&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;markdown-style-guide&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Markdown Style Guide&quot;],&quot;description&quot;:[0,&quot;Here is a sample of some basic Markdown syntax that can be used when writing Markdown content in Astro.&quot;],&quot;pubDate&quot;:[3,&quot;2024-06-19T03:00:00.000Z&quot;],&quot;heroImage&quot;:[0,&quot;/jpg/blog-placeholder-1.jpg&quot;]}],&quot;body&quot;:[0,&quot;Here is a sample of some basic Markdown syntax that can be used when writing Markdown content in Astro.\n\n## Headings\n\nThe following HTML `&lt;h1&gt;`—`&lt;h6&gt;` elements represent six levels of section headings. `&lt;h1&gt;` is the highest section level while `&lt;h6&gt;` is the lowest.\n\n# H1\n\n## H2\n\n### H3\n\n#### H4\n\n##### H5\n\n###### H6\n\n## Paragraph\n\nXerum, quo qui aut unt expliquam qui dolut labo. Aque venitatiusda cum, voluptionse latur sitiae dolessi aut parist aut dollo enim qui voluptate ma dolestendit peritin re plis aut quas inctum laceat est volestemque commosa as cus endigna tectur, offic to cor sequas etum rerum idem sintibus eiur? Quianimin porecus evelectur, cum que nis nust voloribus ratem aut omnimi, sitatur? Quiatem. Nam, omnis sum am facea corem alique molestrunt et eos evelece arcillit ut aut eos eos nus, sin conecerem erum fuga. Ri oditatquam, ad quibus unda veliamenimin cusam et facea ipsamus es exerum sitate dolores editium rerore eost, temped molorro ratiae volorro te reribus dolorer sperchicium faceata tiustia prat.\n\nItatur? Quiatae cullecum rem ent aut odis in re eossequodi nonsequ idebis ne sapicia is sinveli squiatum, core et que aut hariosam ex eat.\n\n## Images\n\n### Syntax\n\n```markdown\n![Alt text](./full/or/relative/path/of/image)\n```\n\n### Output\n\n![blog placeholder](/jpg/blog-placeholder-about.jpg)\n\n## Blockquotes\n\nThe blockquote element represents content that is quoted from another source, optionally with a citation which must be within a `footer` or `cite` element, and optionally with in-line changes such as annotations and abbreviations.\n\n### Blockquote without attribution\n\n#### Syntax\n\n```markdown\n&gt; Tiam, ad mint andaepu dandae nostion secatur sequo quae.  \n&gt; **Note** that you can use _Markdown syntax_ within a blockquote.\n```\n\n#### Output\n\n&gt; Tiam, ad mint andaepu dandae nostion secatur sequo quae.  \n&gt; **Note** that you can use _Markdown syntax_ within a blockquote.\n\n### Blockquote with attribution\n\n#### Syntax\n\n```markdown\n&gt; Don&#39;t communicate by sharing memory, share memory by communicating.&lt;br&gt;\n&gt; — &lt;cite&gt;Rob Pike[^1]&lt;/cite&gt;\n```\n\n#### Output\n\n&gt; Don&#39;t communicate by sharing memory, share memory by communicating.&lt;br&gt;\n&gt; — &lt;cite&gt;Rob Pike[^1]&lt;/cite&gt;\n\n[^1]: The above quote is excerpted from Rob Pike&#39;s [talk](https://www.youtube.com/watch?v=PAAkCSZUG1c) during Gopherfest, November 18, 2015.\n\n## Tables\n\n### Syntax\n\n```markdown\n| Italics   | Bold     | Code   |\n| --------- | -------- | ------ |\n| _italics_ | **bold** | `code` |\n```\n\n### Output\n\n| Italics   | Bold     | Code   |\n| --------- | -------- | ------ |\n| _italics_ | **bold** | `code` |\n\n## Code Blocks\n\n### Syntax\n\nwe can use 3 backticks ``` in new line and write snippet and close with 3 backticks on new line and to highlight language specific syntax, write one word of language name after first 3 backticks, for eg. html, javascript, css, markdown, typescript, txt, bash\n\n````markdown\n```html\n&lt;!doctype html&gt;\n&lt;html lang=\&quot;pt-BR\&quot;\&quot;&gt;\n  &lt;head&gt;\n    &lt;meta charset=\&quot;utf-8\&quot; /&gt;\n    &lt;title&gt;Example HTML5 Document&lt;/title&gt;\n  &lt;/head&gt;\n  &lt;body&gt;\n    &lt;p&gt;Test&lt;/p&gt;\n  &lt;/body&gt;\n&lt;/html&gt;\n```\n````\n\n### Output\n\n```html\n&lt;!doctype html&gt;\n&lt;html lang=\&quot;pt-BR\&quot;\&quot;&gt;\n  &lt;head&gt;\n    &lt;meta charset=\&quot;utf-8\&quot; /&gt;\n    &lt;title&gt;Example HTML5 Document&lt;/title&gt;\n  &lt;/head&gt;\n  &lt;body&gt;\n    &lt;p&gt;Test&lt;/p&gt;\n  &lt;/body&gt;\n&lt;/html&gt;\n```\n\n## List Types\n\n### Ordered List\n\n#### Syntax\n\n```markdown\n1. First item\n2. Second item\n3. Third item\n```\n\n#### Output\n\n1. First item\n2. Second item\n3. Third item\n\n### Unordered List\n\n#### Syntax\n\n```markdown\n- List item\n- Another item\n- And another item\n```\n\n#### Output\n\n- List item\n- Another item\n- And another item\n\n### Nested list\n\n#### Syntax\n\n```markdown\n- Fruit\n  - Apple\n  - Orange\n  - Banana\n- Dairy\n  - Milk\n  - Cheese\n```\n\n#### Output\n\n- Fruit\n  - Apple\n  - Orange\n  - Banana\n- Dairy\n  - Milk\n  - Cheese\n\n## Other Elements — abbr, sub, sup, kbd, mark\n\n### Syntax\n\n```markdown\n&lt;abbr title=\&quot;Graphics Interchange Format\&quot;&gt;GIF&lt;/abbr&gt; is a bitmap image format.\n\nH&lt;sub&gt;2&lt;/sub&gt;O\n\nX&lt;sup&gt;n&lt;/sup&gt; + Y&lt;sup&gt;n&lt;/sup&gt; = Z&lt;sup&gt;n&lt;/sup&gt;\n\nPress &lt;kbd&gt;CTRL&lt;/kbd&gt; + &lt;kbd&gt;ALT&lt;/kbd&gt; + &lt;kbd&gt;Delete&lt;/kbd&gt; to end the session.\n\nMost &lt;mark&gt;salamanders&lt;/mark&gt; are nocturnal, and hunt for insects, worms, and other small creatures.\n```\n\n### Output\n\n&lt;abbr title=\&quot;Graphics Interchange Format\&quot;&gt;GIF&lt;/abbr&gt; is a bitmap image format.\n\nH&lt;sub&gt;2&lt;/sub&gt;O\n\nX&lt;sup&gt;n&lt;/sup&gt; + Y&lt;sup&gt;n&lt;/sup&gt; = Z&lt;sup&gt;n&lt;/sup&gt;\n\nPress &lt;kbd&gt;CTRL&lt;/kbd&gt; + &lt;kbd&gt;ALT&lt;/kbd&gt; + &lt;kbd&gt;Delete&lt;/kbd&gt; to end the session.\n\nMost &lt;mark&gt;salamanders&lt;/mark&gt; are nocturnal, and hunt for insects, worms, and other small creatures.&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/markdown-style-guide.md&quot;],&quot;digest&quot;:[0,&quot;4c6315b11c3cfb2a&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;Here is a sample of some basic Markdown syntax that can be used when writin
